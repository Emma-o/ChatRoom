<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>
</head>

<body>

    <h1>Create account</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="post">

        <div>
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div>
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div>
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <div>
            <label for="role">
                Role
            </label>

            <select
                id="role"
                name="role"
            >
                <option value="participant">
                    Participant
                </option>

                <option value="host">
                    Host
                </option>
            </select>
        </div>

        <button type="submit">
            Register
        </button>

    </form>
<p>
    Already have an account?

    <a href="{{ url_for('auth.login') }}">
        Login
    </a>
</p>
</body>
</html>
